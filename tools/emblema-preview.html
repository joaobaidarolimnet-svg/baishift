<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1400px;height:600px;overflow:hidden;background:#040A1F}svg{display:block}</style></head>
<body>
<svg id="s" width="1400" height="600" viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="45%" cy="50%" r="60%"><stop offset="0%" stop-color="#0A1D4F"/><stop offset="100%" stop-color="#040A1F"/></radialGradient>
    <linearGradient id="bfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6FA8FF"/><stop offset="55%" stop-color="#1F5CF5"/><stop offset="100%" stop-color="#0B36B8"/></linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="700" y2="0"><stop offset="0%" stop-color="#0B36B8" stop-opacity=".2"/><stop offset="45%" stop-color="#1F5CF5"/><stop offset="100%" stop-color="#4D9BFF"/></linearGradient>
    <linearGradient id="orange" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1120" y2="0"><stop offset="0%" stop-color="#FF9A3D"/><stop offset="55%" stop-color="#FF5A1F"/><stop offset="100%" stop-color="#E8261A"/></linearGradient>
    <linearGradient id="blue2" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1120" y2="0"><stop offset="0%" stop-color="#4D9BFF"/><stop offset="60%" stop-color="#1F5CF5"/><stop offset="100%" stop-color="#0B36B8"/></linearGradient>
    <linearGradient id="ift" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFB05A"/><stop offset="50%" stop-color="#FF5A1F"/><stop offset="100%" stop-color="#D9221A"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFB05A"/><stop offset="100%" stop-color="#FF4A1F"/></linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="haze" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <marker id="none"/>
  </defs>
  <rect width="1400" height="600" fill="url(#bg)"/>
  <!-- névoas de cor -->
  <ellipse cx="420" cy="330" rx="420" ry="150" fill="#1F5CF5" opacity=".32" filter="url(#haze)"/>
  <ellipse cx="1060" cy="190" rx="260" ry="120" fill="#FF4A1F" opacity=".28" filter="url(#haze)"/>
  <ellipse cx="1040" cy="470" rx="240" ry="90" fill="#1F5CF5" opacity=".26" filter="url(#haze)"/>

  <!-- trilhas de circuito entrando pela esquerda -->
  <g id="circ" fill="none" stroke="#3D8BFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></g>

  <!-- faixas: duas trilhas que se cruzam atrás do badge (a de baixo vira a seta laranja de cima; a de cima vira a azul de baixo) -->
  <g id="bandas"></g>

  <!-- B tridimensional -->
  <g transform="skewX(-9)">
    <text x="322" y="424" font-family="Sora" font-weight="800" font-size="284" fill="#1F5CF5" opacity=".55" filter="url(#soft)">B</text>
    <text x="322" y="424" font-family="Sora" font-weight="800" font-size="284" fill="#061B5C" transform="translate(10 10)">B</text>
    <text x="322" y="424" font-family="Sora" font-weight="800" font-size="284" fill="url(#bfill)">B</text>
  </g>

  <!-- badge AI -->
  <g id="badge">
    <rect x="545" y="248" width="196" height="196" rx="34" fill="#FF6A2A" opacity=".55" filter="url(#soft)"/>
    <rect x="548" y="251" width="190" height="190" rx="32" fill="#061236"/>
    <rect x="548" y="251" width="190" height="190" rx="32" fill="none" stroke="url(#ring)" stroke-width="4" filter="url(#glow)"/>
    <g id="chip" stroke="#2C5BD6" stroke-width="1.6" fill="none" opacity=".55"></g>
    <g transform="skewX(-9)">
      <text x="700" y="390" text-anchor="middle" font-family="Sora" font-weight="800" font-size="86" fill="#fff" filter="url(#glow)" letter-spacing="-2">AI</text>
    </g>
    <g id="spark-small"></g>
  </g>

  <!-- Shift -->
  <g transform="skewX(-9)">
    <text x="820" y="418" font-family="Sora" font-weight="800" font-size="236" fill="#0F2456" stroke="#3D6FFF" stroke-width="2" letter-spacing="-8" filter="url(#glow)">Sh</text>
    <text x="1126" y="418" font-family="Sora" font-weight="800" font-size="236" fill="url(#ift)" letter-spacing="-8" filter="url(#glow2)">ift</text>
  </g>

  <g id="spark-big"></g>
  <g id="pixels"></g>
</svg>
<script>
const NS="http://www.w3.org/2000/svg";
const E=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const $=id=>document.getElementById(id);
/* circuito */
const circ=$("circ");
const traces=[[40,170,[[150,170],[190,205],[330,205],[330,240]]],[40,215,[[120,215],[160,250],[290,250]]],[40,262,[[230,262],[262,292],[300,292]]],
              [40,438,[[230,438],[262,408],[300,408]]],[40,485,[[120,485],[160,450],[290,450]]],[40,530,[[150,530],[190,495],[330,495],[330,460]]]];
for (const [x,y,pts] of traces) {
  circ.appendChild(E("path",{d:"M"+x+","+y+" "+pts.map(p=>"L"+p[0]+","+p[1]).join(" ")}));
  circ.appendChild(E("circle",{cx:x,cy:y,r:11,fill:"#040A1F","stroke-width":5}));
  circ.appendChild(E("circle",{cx:x,cy:y,r:3.5,fill:"#7FB8FF",stroke:"none"}));
  const e=pts[pts.length-1]; circ.appendChild(E("circle",{cx:e[0],cy:e[1],r:5,fill:"#7FB8FF",stroke:"none"}));
}
/* bandas */
const b=$("bandas"), W=44;
const bandL1="M130,300 C420,300 470,346 640,346";  /* de cima-esquerda ao centro */
const bandL2="M130,392 C420,392 470,346 640,346";  /* de baixo-esquerda ao centro */
const arrO="M640,346 C760,346 820,250 940,214 L1010,196";   /* laranja sobe */
const arrB="M640,346 C760,346 820,442 940,478 L1010,496";   /* azul desce */
function tube(d, grad, core, glowC, w){
  b.appendChild(E("path",{d,fill:"none",stroke:glowC,"stroke-width":w*2.2,"stroke-linecap":"round",opacity:.35,filter:"url(#soft)"}));
  b.appendChild(E("path",{d,fill:"none",stroke:grad,"stroke-width":w,"stroke-linecap":"round","stroke-linejoin":"round",filter:"url(#glow)"}));
  b.appendChild(E("path",{d,fill:"none",stroke:core,"stroke-width":w*.16,"stroke-linecap":"round",opacity:.85,transform:"translate(0 "+(-w*.22)+")"}));
}
tube(bandL1,"url(#band)","#BFE0FF","#1F5CF5",W);
tube(bandL2,"url(#band)","#BFE0FF","#1F5CF5",W);
tube(arrB,"url(#blue2)","#BFE0FF","#1F5CF5",W);
tube(arrO,"url(#orange)","#FFE0B0","#FF4A1F",W);
/* pontas de seta grandes, alinhadas com a tangente final */
function head(x,y,ang,fill,glowC){
  const h=E("path",{d:"M-70,-46 L20,0 L-70,46 Q-40,0 -70,-46Z",fill,transform:`translate(${x} ${y}) rotate(${ang})`,filter:"url(#glow)"});
  b.appendChild(E("path",{d:"M-70,-46 L20,0 L-70,46 Q-40,0 -70,-46Z",fill:glowC,opacity:.45,transform:`translate(${x} ${y}) rotate(${ang})`,filter:"url(#soft)"}));
  b.appendChild(h);
}
head(1030,191,-15,"url(#orange)","#FF4A1F");
head(1030,501,15,"url(#blue2)","#1F5CF5");
/* traço de luz na seta laranja */
b.appendChild(E("path",{d:"M700,338 C790,330 840,262 930,226",fill:"none",stroke:"#fff","stroke-width":5,"stroke-linecap":"round",opacity:.85,filter:"url(#glow)"}));
b.appendChild(E("path",{d:"M700,354 C790,362 840,430 930,466",fill:"none",stroke:"#BFE0FF","stroke-width":4,"stroke-linecap":"round",opacity:.6,filter:"url(#glow)"}));
/* padrão de chip dentro do badge */
const chip=$("chip");
for (const [x1,y1,x2,y2] of [[566,270,600,270],[566,270,566,300],[720,270,690,270],[720,270,720,300],[566,422,600,422],[566,422,566,392],[720,422,690,422],[720,422,720,392],[600,270,600,282],[690,422,690,410]]) chip.appendChild(E("line",{x1,y1,x2,y2}));
for (const [cx,cy] of [[600,282],[690,410],[566,300],[720,392]]) chip.appendChild(E("circle",{cx,cy,r:2.6,fill:"#4D8BFF",stroke:"none"}));
/* faíscas */
const sp=(host,x,y,k,c,rot)=>{const q=k*.26;host.appendChild(E("path",{d:`M0,${-k} L${q},${-q} L${k},0 L${q},${q} L0,${k} L${-q},${q} L${-k},0 L${-q},${-q}Z`,fill:c,transform:`translate(${x} ${y}) rotate(${rot||0})`,filter:"url(#glow2)"}));};
sp($("spark-small"),712,296,20,"#fff",0);
sp($("spark-big"),1150,120,58,"#FF7A2A",0); sp($("spark-big"),1200,200,20,"#FFB05A",15); sp($("spark-big"),1108,84,12,"#FFD29A",0);
/* pixels dissolvendo à direita */
const px=$("pixels"), rnd=(()=>{let s=17;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;}})();
for (let i=0;i<16;i++){const x=1180+rnd()*190, y=430+rnd()*140, k=8+rnd()*20, blue=rnd()>.42;
  px.appendChild(E("rect",{x,y,width:k,height:k,rx:k*.2,fill:blue?"#2E7BFF":"#FF6A2A",opacity:.55+rnd()*.45,transform:`rotate(${-8+rnd()*16} ${x} ${y})`,filter:"url(#glow)"}));}
</script>
</body></html>
