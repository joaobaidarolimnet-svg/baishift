<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#142F7A;color:#fff;font-family:"Archivo",system-ui,sans-serif;position:relative}
  .glow{position:absolute;inset:-30% -10% auto -14%;height:760px;
    background:radial-gradient(46% 60% at 26% 4%,rgba(12,27,74,.7),transparent 66%)}
  .glow2{position:absolute;right:-12%;bottom:-34%;width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle,rgba(239,86,46,.22),transparent 62%)}
  .in{position:relative;padding:66px 74px;height:100%;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:16px}
  .brand svg{width:54px;height:54px;display:block}
  .brand .n{font-family:"Archivo",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1}
  .brand .d{font-family:"Archivo",sans-serif;font-size:12px;letter-spacing:.16em;
    color:rgba(255,255,255,.5);margin-top:5px}
  h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:62px;line-height:1.06;
    letter-spacing:-.028em;margin-top:auto;max-width:19ch}
  h1 em{font-style:normal;color:#EF562E}
  p{margin-top:24px;font-size:23px;line-height:1.45;color:rgba(255,255,255,.68);max-width:44ch}
  .tags{display:flex;gap:10px;margin-top:38px;flex-wrap:wrap}
  .tags span{font-family:"Archivo",sans-serif;font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.22);
    border-radius:99px;padding:9px 17px}
  .rule{position:absolute;left:0;right:0;bottom:0;height:7px;
    background:linear-gradient(90deg,#2A4189 0 62%,#EF562E 62% 100%)}
</style></head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="in">
    <div class="brand"><img src="../assets/marca/01-logo/baishift-branco.svg" alt="" style="height:84px;width:auto;display:block"></div>
    <h1>Software feito <em>dentro da operação</em>, não em cima dela.</h1>
    <p>Gestão de provedores, painéis sob medida e aplicativos próprios —
       para gestores de alta performance, autônomos e estudantes.</p>
    <div class="tags">
      <span>Provedores</span><span>Painéis sob medida</span><span>Aplicativos</span>
    </div>
  </div>
  <div class="rule"></div>
</body></html>
